[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohortfit"
version = "0.1.0"
description = "Genomic feasibility auditing for clinical trial protocols"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "anukriti-pgx-core==0.7.2",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cohortfit = "cohortfit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cohortfit = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# typer.Argument / typer.Option in argument defaults is the documented Typer
# idiom, and fastapi.Body / Depends / Query are the documented FastAPI idiom —
# not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Query",
    "typer.Argument",
    "typer.Option",
]
