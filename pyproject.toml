[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohortfit"
version = "0.1.0"
description = "Genomic feasibility auditing for clinical trial protocols"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Pinned exactly per AGENTS.md: a new engine version carries CPIC table
    # updates that need clinical regression review first. 0.9.0 reviewed and
    # approved 2026-08-17 — see anukriti-pgx-core
    # docs/REGRESSION_REVIEW_0.8.2_to_0.9.0.md. 1,991 genotype cases:
    # SAFETY_FIX 64, NOMENCLATURE 18, SAME 1909; zero NEWLY_INDETERMINATE,
    # zero OVER_RESTRICTION_FIX, zero PHENOTYPE_CHANGE, zero ACTION_LOST.
    #
    # DPYD is NOT untouched in this release, unlike 0.8.1. The DPYD panel grows
    # 13 -> 18 alleles and the diplotype table 105 -> 190, so this package's
    # `load_diplotype_table("DPYD")` returns a larger table — which is why the
    # count assertion in tests/test_pgx.py is now a floor rather than an
    # equality. Tag-only HapB3 samples also resolve to the label `c.1236G>A`
    # rather than `HapB3`; cohortfit keys its frequency fixtures by its own
    # allele names, so no fixture changed, but anything added here that
    # string-matches "HapB3" must account for it.
    # NOT bumped to 0.11.0, and this is a finding rather than an oversight.
    # On 2026-10-14 an audit flagged every figure in docs/ as contaminated by
    # the diplotype truncation bug that 0.11.0 fixes (bc0382b: build_diplotype
    # truncated by allele NAME, dropping HapB3 -- the allele this repo's whole
    # argument is about). It was checked rather than assumed: every Finding was
    # computed under 0.9.0 and 0.11.0 side by side and came out byte-identical,
    # the 78.0% SAS HapB3 share included.
    #
    # The reason is structural. This package never calls build_diplotype. It
    # expands its own allele frequencies under HWE using its own allele names
    # and looks up the engine's phenotype TABLE, so the truncation defect has
    # no path into these numbers. tests/test_panel.py::TestEngineCouplingSurface
    # holds that property so it cannot be lost in a refactor without a red test.
    #
    # So there is no correctness reason to move, and AGENTS.md requires a
    # clinical regression review before an engine bump. 0.11.0 does not have a
    # clinician sign-off (see anukriti-pgx-core
    # docs/REGRESSION_REVIEW_0.10.0_to_0.11.0.md, which says so in its own
    # verdict). Bumping on no benefit to inherit an unreviewed table would be
    # the trade backwards.
    "anukriti-pgx-core==0.9.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cohortfit = "cohortfit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cohortfit = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# typer.Argument / typer.Option in argument defaults is the documented Typer
# idiom, and fastapi.Body / Depends / Query are the documented FastAPI idiom —
# not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Query",
    "typer.Argument",
    "typer.Option",
]
